[package]
name = "pallet-ai-reserve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Solvyren AI reserve S4 (ISOLATED): calls 12-15 plus T-B call 16 on a mock runtime only. Not part of any Runtime composition."

[dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive"] }
frame-support.workspace = true
frame-system.workspace = true
sp-io.workspace = true
sp-runtime.workspace = true
serde = { version = "1.0.219", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
pallet-balances.workspace = true

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-balances/std",
    "scale-info/std",
    "serde/std",
    "sp-io/std",
    "sp-runtime/std",
]
