[package]
name = "pallet-ai-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
frame-support = { version = "=43.0.2", default-features = false }
frame-system = { version = "=43.0.1", default-features = false }

[features]
default = ["std"]
std = ["codec/std", "scale-info/std", "frame-support/std", "frame-system/std"]

[dev-dependencies]
pallet-balances = "=44.0.0"
sp-io = "=43.0.0"
sp-runtime = "=44.0.0"
