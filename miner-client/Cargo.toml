[package]
name = "eagle-miner"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
nvml-wrapper = "=0.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
